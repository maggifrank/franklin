<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" gradientUnits="userSpaceOnUse"
                    cx="240" cy="0" r="1000" gradientTransform="scale(1,0.5)">
      <stop offset="0"   stop-color="#1b2757"/>
      <stop offset="0.6" stop-color="#0b1020"/>
      <stop offset="1"   stop-color="#0b1020"/>
    </radialGradient>
    <mask id="shell-cuts">
      <rect x="0" y="0" width="100" height="100" fill="white"/>
      <g stroke="black" stroke-width="3" fill="none">
        <polygon points="59,34.4 68,50 59,65.6 41,65.6 32,50 41,34.4"/>
        <line x1="59" y1="34.4" x2="66" y2="22.3"/>
        <line x1="68" y1="50"   x2="82" y2="50"/>
        <line x1="59" y1="65.6" x2="66" y2="77.7"/>
        <line x1="41" y1="65.6" x2="34" y2="77.7"/>
        <line x1="32" y1="50"   x2="18" y2="50"/>
        <line x1="41" y1="34.4" x2="34" y2="22.3"/>
      </g>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- turtle, 100x100 artwork scaled to 220 -->
  <g transform="translate(100,205) scale(2.2)">
    <circle cx="50" cy="50" r="46" fill="#DCDCDC"/>
    <g fill="#000000">
      <rect x="76" y="44" width="10" height="12" transform="rotate(-30 50 50)"/>
      <rect x="76" y="44" width="10" height="12" transform="rotate(-150 50 50)"/>
      <rect x="76" y="44" width="10" height="12" transform="rotate(30 50 50)"/>
      <rect x="76" y="44" width="10" height="12" transform="rotate(150 50 50)"/>
      <polygon points="44,77 56,77 50,91"/>
      <path d="M 43,23 L 43,12 L 46,7 L 54,7 L 57,12 L 57,23 Z"/>
      <polygon points="66,22.3 82,50 66,77.7 34,77.7 18,50 34,22.3" mask="url(#shell-cuts)"/>
    </g>
    <rect x="46.5" y="11" width="2" height="2" fill="white"/>
    <rect x="51.5" y="11" width="2" height="2" fill="white"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="392" y="292" font-size="74" font-weight="700" fill="#e9ecf1">Magnús Franklín</text>
    <text x="396" y="350" font-size="30" fill="#b8c0d6">Sérfræðingur í upplýsingatækni · Hafnarfjörður</text>
    <text x="396" y="412" font-size="27" font-weight="600" fill="#7aa2ff">franklin.is</text>
  </g>
</svg>
